<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Звіт ДСУ у справах дітей</title><style>
:root{--g:#7DB828;--o:#EF8B0F;--bg:#fafaf6;--tx:#222}
body{margin:0;font-family:Tahoma,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#fff;border-bottom:4px solid var(--g);padding:16px 24px}h1{margin:0;font-size:20px}h1 span{color:var(--o)}
main{max-width:1100px;margin:0 auto;padding:20px 24px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:6px;padding:12px 22px;font-size:16px;cursor:pointer;background:var(--o);color:#fff;font-weight:700}
button.sec{background:#fff;color:var(--tx);border:1px solid #ccc;font-weight:400;padding:8px 14px;font-size:14px}button:disabled{opacity:.5;cursor:default}
.meta{font-size:14px;color:#555}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--g);margin-right:6px}
.box{background:#fff;border:1px solid #e3e3d8;border-radius:8px;padding:14px 16px;margin:12px 0}
.err{color:#b00020;white-space:pre-wrap}.warn{background:#fff7e6;border-color:#f0c36d}
table{border-collapse:collapse;font-size:12px;width:100%}td{border:1px solid #ddd;padding:3px 6px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:first-child td{background:#F6F5F0;font-weight:700}.scroll{overflow:auto}h3{margin:6px 0}
a.dl{display:inline-block;background:var(--g);color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:700}
label{display:block;font-size:13px;margin:8px 0 2px;color:#555}input[type=text],input[type=password],input[type=number]{width:100%;box-sizing:border-box;padding:7px;border:1px solid #ccc;border-radius:4px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}details summary{cursor:pointer;font-weight:700}
</style></head><body>
<header><h1>Звіт Державної служби України у справах дітей — <span id="yr"></span></h1></header>
<main>
<div class="bar"><button id="gen">📄 Сформувати звіт (Word)</button><button id="ref" class="sec">⟳ Оновити дані зараз</button>
<div class="meta" id="meta">Завантаження…</div></div>
<div class="box" id="jobbox" style="display:none"></div>
<div class="box err" id="err" style="display:none"></div>
<details class="box" id="settings"><summary>⚙ Налаштування</summary>
<label>Посилання на Google-таблицю (доступ «Усі, хто має посилання → Читач»)</label><input type="text" id="s_url">
<div class="row"><div><label>Додаткові вкладки (gid через кому)</label><input type="text" id="s_gids" placeholder="наприклад 0, 123456"></div>
<div><label>Звітний рік</label><input type="number" id="s_year"></div></div>
<div class="row"><div><label>ШІ-провайдер</label><select id="s_prov" style="width:100%;padding:7px"><option value="gemini">Google Gemini (безкоштовно)</option><option value="anthropic">Anthropic Claude (платно)</option></select><label>API-ключ (зберігається лише в цьому браузері)</label><input type="password" id="s_key" placeholder="AIza... або sk-ant-..."></div>
<div><label>Модель</label><input type="text" id="s_model"></div></div>
<label>Текст на титулці замість «за N рік» (необов'язково)</label><input type="text" id="s_period">
<p><button class="sec" id="save">Зберегти</button> <label style="display:inline">Або завантажити вкладки вручну (CSV): <input type="file" id="csv" accept=".csv" multiple></label></p></details>
<div id="tabs"></div></main>

const TEMPLATE_MD="ЗВІТ про підсумки діяльності Державної служби України у справах дітей за 2025 рік\n\n# ВСТУП \n\n> Державна служба України у справах дітей є центральним органом виконавчої влади, діяльність якого спрямовується та координується Кабінетом Міністрів України через Міністра соціальної політики, сім'ї та єдності.\n>\n> Служба забезпечує реалізацію державної політики у сфері захисту прав дітей, включаючи дітей-сиріт, дітей, позбавлених батьківського піклування, координацію надання соціальних послуг сім\\'ям з дітьми, розвиток сімейних форм виховання та усиновлення.\n>\n> Наша місія --- захищати права дітей, забезпечувати їхнє благополуччя та всебічний розвиток, сприяти соціальній інтеграції дітей-сиріт та дітей, позбавлених батьківського піклування, а також підтримувати родини в кризових ситуаціях, щоб кожна дитина мала можливість жити у турботливій сім'ї.\n>\n> Наша діяльність ґрунтується на принципах дитиноцентризму та безумовного пріоритету сімейного виховання. Принцип «кожна дитина має виховуватися в родині» є визначальним в реалізації державної політики у сфері захисту прав дітей.\n>\n> Відповідно до Конвенції ООН про права дитини, кожна дитина має право зростати у сімейному середовищі, а сім'ям мають бути надані необхідний захист і підтримка. Саме сім'я створює умови для гармонійного розвитку дитини та формує основу її майбутнього.\n\n###### Місія Служби полягає в реалізації державної політики, що гарантує: \n\n-   Інтеграцію в суспільство. Сприяння соціальній адаптації та інтеграції дітей-сиріт та дітей, позбавлених батьківського піклування, через освіту, професійне навчання та підтримку при працевлаштуванні.\n\n-   Соціальну підтримку. Надання комплексної соціальної, медичної та психологічної допомоги дітям, що перебувають у складних життєвих обставинах, а також їхнім родинам. Розвиток послуги патронату та наставництва.\n\n-   Популяризацію сімейних форм виховання. Розвиток і підтримка національного усиновлення, врахування інтересів дитини під час призначення опіки/піклування, сприяння створенню прийомних сімей і дитячих будинків сімейного типу. Забезпечення права кожної дитини на зростання в сімейному середовищі.\n\n-   Захист прав дітей. Збереження та забезпечення основних прав і свобод дітей, зокрема, права на життя, розвиток, сімейне виховання та освіту.\n\n> В умовах воєнного стану діяльність Служби спрямована на забезпечення стабільності системи захисту прав дітей, недопущення порушення їхніх прав та забезпечення державної підтримки кожній дитині, яка цього потребує.\n\n# ІНФОРМАЦІЯ ПРО РЕЗУЛЬТАТИ РОБОТИ ТА АНАЛІЗ ДІЯЛЬНОСТІ\n\n## Розвиток сімейних форм виховання та усиновлення\n\n> Службою у звітному періоді забезпечено реалізацію повноважень у сфері розвитку сімейних форм виховання та усиновлення, зокрема:\n\n-   забезпечення реалізації державної політики у сфері розвитку сімейних форми виховання та усиновлення;\n\n-   координація діяльності служб у справах дітей обласних, Київської міської державних (військових) адміністрацій та органів місцевого самоврядування;\n\n-   ведення обліку (в тому числі централізованого) дітей-сиріт і дітей, позбавлених батьківського піклування, які можуть бути усиновленими;\n\n-   забезпечено функціонування банку даних про дітей-сиріт і дітей, позбавлених батьківського піклування, сім\\'ї потенційних усиновлювачів, опікунів, піклувальників, прийомних батьків, батьків-вихователів у порядку, встановленому Мінсоцполітики;\n\n-   сприяння розвитку сімейних форм виховання, влаштування дітей-сиріт і дітей, позбавлених батьківського піклування, у дитячі будинки сімейного типу, прийомні сім\\'ї, взяттю дітей під опіку, піклування, усиновлення.\n\n##### Усиновлення\n\n> На виконання вимог пункту 13 Порядку провадження діяльності з усиновлення та здійснення нагляду за дотриманням прав усиновлених дітей (постанова Кабінету Міністрів України від 08.10.2008 № 905, зі змінами), Службою забезпечено системну роботу з формування централізованого обліку дітей, які можуть бути усиновлені.\n>\n> У звітному періоді прийнято від обласних служб у справах дітей та поставлено на централізований облік --- **1 875 дітей**. Під час постановки на облік здійснювалася обов'язкова перевірка повноти та достовірності поданих документів.\n>\n> Станом на кінець звітного періоду Службою опрацьовано повідомлення, які надійшли від служб у справах дітей районних у м. Києві держадміністрацій, міських, районних у місті, сільських, селищних рад, з уточненою інформацією щодо стану здоров'я, фізичного та розумового розвитку дитини, відомостей про місце її проживання (перебування), фотокартки (відповідно до вимог пункту 16 Порядку) відносно **561** дитини. Таким чином, забезпечено належний контроль за якістю формування централізованого обліку та мінімізовано ризики порушення прав і законних інтересів дітей на всіх етапах процедури усиновлення.\n>\n> За оперативними даними служб у справах дітей обласних, Київської міської державних (військових) адміністрацій станом на кінець звітного періоду **на місцевому обліку** з усиновлення перебувало **14 352 дитини**, які можуть бути усиновлені. З них:\n\n-   мають братів, сестер на обліку -- **9 993 дітей (69,6%)**;\n\n-   мають інвалідність -- **1 564 дитини (10,9%)**.\n\n##### Із загальної кількості дітей, які можуть бути усиновлені та перебувають на місцевому обліку: \n\n-   віком до 1 року -- 89 дітей (0,6%);\n\n-   від 1-2 років -- 193 дитини (1%);\n\n-   від 3-5 років -- 675 дітей (4,7%);\n\n-   від 6-10 років -- 3 064 дітей (21,4%);\n\n-   від 11 років до 17 років -- 10 331 дитина (72,0%).\n\n>  [ГРАФІК/ДІАГРАМА] \n>\n> Слід зазначити, що із загальної кількості дітей, які можуть бути усиновлені та перебувають на місцевому обліку (14 352) **влаштовано до сімейних форм виховання 10 871 дитину**. З них:\n\n-   під опіку громадян -- 654 дитини (6,0%);\n\n-   в прийомні сім\\'ї та дитячі будинки сімейного типу -- 9 933 дитини (91,4%);\n\n-   в сім\\'ї родичів, знайомих (тимчасове влаштування) -- 284 дитини (2,6%)\n\n [ГРАФІК/ДІАГРАМА] \n\n> За оперативними даними служб у справах дітей обласних, Київської міської державних (військових) адміністрацій протягом 2025 року за рішенням судових органів **усиновлено 1 148 дітей-сиріт та дітей, позбавлених батьківського піклування**, з них:\n\n-   громадянами України -- **1 146 дітей**;\n\n-   іноземними громадянами -- **2 дитини**.\n\n [ГРАФІК/ДІАГРАМА] \n\n> Розподіл усиновлених дітей-сиріт та дітей, позбавлених батьківського піклування за віком:\n\n-   у віці до 1 року усиновлено -- **198 дітей (17,2%)**\n\n-   від 1 року до 2 років -- **239 дитина (20,8%)**\n\n-   від 3 років до 5 років -- **304 дитини (26, 5%)**\n\n-   від 6 років до 10 років -- **273 дитини (23, 8%)**\n\n-   від 11 років до 17 років -- **134 дитини (11,7 %)**\n\n [ГРАФІК/ДІАГРАМА] \n\n> Поряд з тим, за 2025 рік одним із подружжя (внутрішньосімейне усиновлення) за рішенням суду усиновлено **4 138 дитини**, з них двоє дітей -- іноземним громадянином:\n\n-   до 1 року -- 7 дітей\n\n-   1-2 роки - 34 дітей\n\n-   3-5 років - 292 дітей\n\n-   6-10 років -- 1 345 дитина\n\n-   11-17 років -- 2 460 дитини\n\n [ГРАФІК/ДІАГРАМА] \n\n> Протягом звітного року здійснено нагляд та отримано звіти щодо **6 241 усиновленої дитини**. З них:\n\n-   стосовно 2 435 дітей, які перебувають на обліку менш як три роки;\n\n-   стосовно 3 806 дітей, які перебувають на обліку понад три роки.\n\n> Протягом 2025 року **1 469 кандидатів в усиновлювачі знято з обліку відповідно до пункту 29 Порядку**.\n>\n> З них у зв\\'язку:\n\n-   з усиновленням дитини -- **838 осіб (57%)**;\n\n-   із закінченням строку дії висновку про можливість бути усиновлювачем -- **410 осіб (28%)**;\n\n-   з поданням кандидатами в усиновлювачі заяви про зняття з обліку --\n\n##### 212 осіб (14,4%); \n\n-   із з\\'ясуванням або виникненням обставин, що унеможливлюють усиновлення -- **9 осіб (0,6%)**.\n\n##### Кандидати в усиновлювачі \n\n [ГРАФІК/ДІАГРАМА] \n\n> Із загальної кількості сімей, які перебувають на обліку кандидатів в усиновлювачі (2 097), бажаний вік дитини для усиновлення розподіляється таким чином:\n\n-   до 1 року -- 86 сімей;\n\n-   до 3 років -- 280 сімей;\n\n-   до 5 років -- 631 сім\\'я;\n\n-   до 10 років -- 872 сім\\'ї;\n\n-   від 10 років до 18 років -- 244 сім\\'ї;\n\n-   без визначення віку дітей -- 46 сімей.\n\n [ГРАФІК/ДІАГРАМА] \n\n##### Заходи для популяризації усиновлення \n\n-   Здійснено особистий прийом **44 родин** кандидатів в усиновлювачі, яким надано інформацію про **336 дітей**, які перебувають на обліку з усиновлення.\n\n-   Кандидатам в усиновлювачі видано **14 направлень** для знайомства з дітьми, із них **4 дитини усиновлено**, 2 родини розпочали процес усиновлення дитини.\n\n-   Опрацьовано **83 усних звернення** кандидатів в усиновлювачі на\n\n> «гарячу лінію» Служби з питань взаємодобору дитини та сім'ї та отримання консультаційної допомоги з питань усиновлення.\n\n-   На підставі розгляду звернень здійснено координацію роботи обласних служб у справах дітей щодо надання уточненої інформації кандидатам в усиновлювачі стосовно **756 дітей**, які можуть бути усиновлені.\n\n-   Підготовлено та надано інформацію для розміщення в соціальних мережах Служби (10 публікацій протягом року).\n\n### Сімейні форми виховання\n\n> Забезпечення права кожної дитини на виховання в сімейному оточенні є одним із пріоритетних напрямів державної політики у сфері захисту прав дітей. Реалізація цього права здійснюється шляхом розвитку сімейних форм виховання, зокрема опіки, піклування, прийомних сімей та дитячих будинків сімейного типу.\n>\n> Питання функціонування зазначених форм виховання нормативно врегульовані положеннями Цивільний кодекс України, Сімейний кодекс України, законами України «Про охорону дитинства», «Про забезпечення організаційно-правових умов соціального захисту дітей-сиріт та дітей, позбавлених батьківського піклування», Постанова Кабінету Міністрів України від 24 вересня 2008 р. № 866 «Про затвердження Порядку провадження органами опіки та піклування діяльності, пов'язаної із захистом прав дитини», Постанова Кабінету Міністрів України від 26 квітня 2002 р.\n>\n> № 564 «Про затвердження Положення про дитячий будинок сімейного типу», а також Постанова Кабінету Міністрів України від 26 квітня 2002 р. № 565 «Про затвердження Положення про прийомну сім'ю».\n>\n> Спільною ознакою зазначених форм є те, що діти-сироти та діти, позбавлені батьківського піклування, влаштовуються до сімей, які добровільно взяли на\n>\n> себе обов'язки щодо їх виховання та спільного проживання. Обсяг відповідальності та повноважень щодо забезпечення прав та інтересів дітей у цих формах є співмірним.\n>\n> Прийомним сім'ям та дитячим будинкам сімейного типу держава делегує частину своїх повноважень щодо догляду, виховання та розвитку дітей зазначеної категорії. У зв'язку з цим, окрім державної соціальної допомоги на дітей, передбачено грошове забезпечення прийомним батькам і батькам-вихователям за надання соціальних послуг.\n>\n> Основною відмінністю між прийомною сім'єю та дитячим будинком сімейного типу є кількість дітей, які можуть бути влаштовані до сім'ї.\n>\n> Опіка та піклування здебільшого встановлюються над дітьми, які перебувають у родинних зв'язках із опікунами або піклувальниками. У цій формі виховання відсутні обмеження щодо кількості дітей, прийнятих на виховання. При цьому окреме грошове забезпечення опікунам і піклувальникам не передбачено --- виплачується державна соціальна допомога на дитину.\n>\n> За оперативною інформацією служб у справах дітей обласних, Київської міської державних (військових) адміністрацій, станом на кінець 2025 року, на первинному обліку служб у справах дітей перебувало **59 325 дітей-сиріт та дітей, позбавлених батьківського піклування.**\n>\n> Сімейними формами охоплено **54 587 дітей-сиріт та дітей, позбавлених батьківського піклування,** що становить 92% від загальної кількості таких дітей.\n\n [ГРАФІК/ДІАГРАМА] \n\n##### Станом на кінець звітного періоду в Україні функціонувало: \n\n> **1 318 дитячих будинків сімейного типу**, в них 8 727 дітей-сиріт, дітей, позбавлених батьківського піклування, та осіб з їх числа (4 594 хлопчиків,\n>\n> 4 133 дівчат), із них мають інвалідність --- 620.\n>\n> **2 715 прийомних сімей**, в них 5 121 дитина сирота та дитина, позбавлена батьківського піклування, та особа з їх числа (2 576 хлопчиків, 2 545 дівчат), із них мають інвалідність --- 390.\n\n [ГРАФІК/ДІАГРАМА] \n\n> Всього в дитячих будинках сімейного типу та прийомних сім\\'ях виховується\n>\n> **13 848** дітей-сиріт та дітей, позбавлених батьківського піклування, та осіб з їх числа, з них: **12 200** дітей-сиріт та дітей, позбавлених батьківського піклування, та **1 648** особи з їх числа.\n>\n> Впродовж 2025 року до дитячих будинків сімейного було влаштовано **1445** дітей-сиріт та дітей, позбавлених батьківського піклування, до прийомних сімей - 816 дітей-сиріт та дітей, позбавлених батьківського піклування.\n>\n> **Протягом 2025 року було створено** 86 ДБСТ. Влаштовано до новостворених та функціонуючих ДБСТ 1445 дітей.\n>\n> **Протягом 2025 року було** створено 326 ПС. Влаштовано до новостворених та функціонуючих ПС 816 дітей.\n>\n> ***Станом на кінець звітного періоду у 31 841 опікуна/піклувальника виховувалося* 42 387 дітей,** з них 1 971 дитина з інвалідністю.\n\n##### Опікуни, які перебувають у родинних стосунках з дітьми --- 26 611 осіб. Не є родичами --- 5 230 осіб. \n\n#####  \n\n> **Структура родинних зв\\'язків:**\n\n1.  Бабуся/дідусь -- 16 421 опікунів\n\n2.  Тітка/дядько -- 6 977 опікунів\n\n3.  Повнолітні сестри/брати -- 3 213 опікунів\n\n### Координація та методичний супровід з питань захисту прав дітей\n\n###### 1.1.3. Субвенція на придбання житла для ДБСТ \n\n> У межах виконання покладених повноважень Державна служба України у справах дітей забезпечує щомісячний моніторинг стану використання коштів за бюджетною програмою КПКВК 2511800 «Субвенція з державного бюджету місцевим бюджетам на реалізацію публічного інвестиційного проєкту із забезпечення житлом дитячих будинків сімейного типу, дітей-сиріт та дітей, позбавлених батьківського піклування».\n>\n> Інформація щодо виконання зазначеної програми надходить від обласних, Київської міської державних (військових) адміністрацій відповідно до вимог постанова Кабінету Міністрів України від 7 березня 2025 року № 284.\n>\n> Упродовж 2025 року Службою здійснювалася координація діяльності регіонів щодо:\n\n-   дотримання порядку та умов використання коштів субвенції;\n\n-   своєчасного подання звітності;\n\n-   узагальнення інформації про стан реалізації публічного інвестиційного проєкту;\n\n-   надання методичних роз'яснень з питань придбання житла для дитячих будинків сімейного типу та дітей визначених категорій.\n\n> За результатами щомісячного моніторингу забезпечувалося оперативне реагування на проблемні питання, надання рекомендацій регіонам та узагальнення практики реалізації програми з метою підвищення ефективності використання державних коштів і забезпечення житлових прав дітей-сиріт та дітей, позбавлених батьківського піклування.\n>\n> Згідно з розподілом на забезпечення житлом дитячих будинків сімейного типу в 2025 році було виділено **833 000,00 тис. грн**, із яких освоєно - **712 093,980 млн грн** коштів субвенції (85,5%).\n>\n> За 2025 рік регіонами придбано **124 житлових об\\'єктів**. **Для яких категорій ДБСТ:**\n\n-   ВПО (евакуйовані) -- 61 ДБСТ;\n\n-   новостворені -- 53 ДБСТ;\n\n-   повернені з-за кордону -- 10 ДБСТ.\n\n [ГРАФІК/ДІАГРАМА] \n\n##### Кількість придбаних ДБСТ коштом субвенції у 2025 році: \n\n+---------+----------------------------------------+---------------------+\n| > **№** | > **Область**                          | > **Придбано**      |\n+=========+========================================+=====================+\n| > 1     | > Вінницька область                    | > 1                 |\n+---------+----------------------------------------+---------------------+\n| > 2     | > Волинська область                    | > 7                 |\n+-   |                  |                                                                                   | > батьки-вихователі, опікуни/піклувальники, усиновлювачі, патронатні вихователі                                     |            |\n+------+------------------+-----------------------------------------------------------------------------------+---------------------------------------------------------------------------------------------------------------------+------------+\n| > 10 | > Офлайн/Он лайн | > Пілотний проєкт із запровадження спеціалізації суддів у справах сім\\'ї та дітей | > Працівники служб у справах дітей територіальних громад                                                            | > 54       |\n+------+------------------+-----------------------------------------------------------------------------------+---------------------------------------------------------------------------------------------------------------------+------------+\n\n## Проведення моніторингу питань у сфері захисту прав дітей\n\n##### Моніторингові візити до евакуйованих за кордон дітей\n\n> Відповідно до пункту 36^-1^ [Порядку провадження органами опіки та](https://zakon.rada.gov.ua/laws/show/866-2008-%D0%BF#n14) [піклування діяльності, пов\\'язаної із захистом прав дитини](https://zakon.rada.gov.ua/laws/show/866-2008-%D0%BF#n14), затвердженого постановою Кабінету Міністрів України від 24.09.2008 № 866 (зі змінами) з метою визначення рівня задоволення базових потреб і забезпечення безпеки дитини, доступності освітніх, медичних, реабілітаційних, соціальних та інших послуг для дитини, її готовності до реінтеграції в сім'ю або подальшого влаштування проводиться оцінювання стану задоволення потреб дитини.\n\n##### На підставі наказів Мінсоцполітики Службою у 2025 році здійснено моніторингові візити до таких країн: \n\n> 1 -- до Литовської Республіки;\n>\n> 1 -- до Королівства Іспанія;\n>\n> 2 -- до Федеративної Республіки Німеччина.\n\n##### Під час моніторингових візитів проведено оцінку потреб 346 дітей та складено відповідні акти: \n\n> 39 -- Литовської Республіки; 58 -- Королівство Іспанії;\n>\n> 249 -- Федеративна Республіка Німеччини.\n>\n> Станом на кінець 2025 року, за оперативною інформацією служб у справах дітей обласних та Київської міської державних (військових) адміністрацій, за межами України **в евакуації перебуває 1 299 дітей.**\n\n## Моніторингові візити до будинків дитини\n\n> Упродовж 2025 року забезпечено моніторинг умов перебування дітей, які проживають або перебувають на цілодобовому утриманні в закладах різних типів, форм власності та підпорядкування.\n>\n> Відповідно до запланованого графіка робочих візитів, у період з 22 січня по\n>\n> 28 серпня 2025 року працівниками Служби здійснено **13 моніторингових візитів до 11 закладів на території України**, зокрема до будинків дитини, центрів медичної реабілітації та закладів паліативної допомоги дітям.\n>\n> За результатами проведених моніторингових візитів здійснено комплексну оцінку умов перебування **359 дітей** у закладах, які були охоплені моніторингом. Під час візитів ознайомлено з умовами перебування дітей у закладах, забезпечення їхніх прав, інтересів та потреб, доступності до медичних, освітніх послуг. За підсумками моніторингу підготовлено та надано відповідні рекомендації обласним державним (військовим) адміністраціям щодо усунення виявлених порушень, посилення міжвідомчої взаємодії та вжиття вичерпних заходів для забезпечення права кожної дитини на виховання в сімейному середовищі.\n>\n> За оперативними даними, які щомісячно до 15 числа подаються обласними державними (військовими) адміністраціями, на завершення звітного року станом на 15.12.2025 у будинках дитини, центрах медичної реабілітації та закладах паліативної допомоги дітям перебувала **731 дитина,** з яких **480** -- діти-сироти та діти, позбавлені батьківського піклування. Із загальної кількості дітей **318** мають встановлену інвалідність, з них **173** дитини потребують паліативної допомоги.\n\n## Робота з виявлення депортованих або примусово переміщених дітей\n\n> Упродовж звітного періоду опрацьовано 25 повідомлень стосовно 47 дітей, які були депортовані, примусово переміщені або перебувають під ризиком депортації чи примусового переміщення.\n>\n> За результатами опрацювання відповідну інформацію направлено до Служби безпеки України, Офіс Генерального прокурора, Національна поліція України для реагування в межах компетенції, а також до Мін\\'юсту з метою внесення відомостей до Реєстру відомостей щодо дітей, депортованих або примусово переміщених у зв'язку зі збройною агресією Російської Федерації проти України.\n\n##### Програма виплат підйомної допомоги 50 тис. \n\n> Відповідно до пункту 16-1 Порядку, затвердженого постановою Кабінету Міністрів України від 14.05.2024 № 551 (зі змінами), із заявою про надання підйомної допомоги після прибуття дитини або особи з-поміж дітей на територію України можуть звернутися її законний представник, уповноважена ним особа або безпосередньо особа. Звернення подається до Служби. Таким чином, держава забезпечує фінансову підтримку родин під час повернення дітей із територій депортації, примусового переміщення або перебування під ризиком такого переміщення, сприяючи їхній безпечній реінтеграції.\n\n##### В 2025 році підйомну допомогу отримало: \n\n-   220 дітей --- через виплату законним представникам (156 осіб) на загальну суму 11 000 000 грн;\n\n-   8 осіб з-поміж дітей --- на загальну суму 400 000 грн.\n\n## Координація надання соціальної підтримки та соціальних послуг у сфері захисту прав дітей\n\n##### Реалізація державної політики у сфері надання соціальних послуг та соціальної підтримки сімʼям з дітьми\n\n#### Надання соціальних послуг та соціальної підтримки сім\\'ям з дітьми, збереження сімейного оточення для дітей, які перебувають в складних життєвих обставинах\n\n####  \n\n> Службою скоординовано роботу з забезпечення міжвідомчої взаємодії в територіальних громадах щодо організації соціальної роботи з сім'ями з дітьми, які перебувають у складних життєвих обставинах (далі --- СЖО), зокрема, заходів щодо виявлення таких сімей та надання їм соціальної підтримки.\n>\n> Загалом, впродовж 2025 року (за даними Нацсоцслужби) **844,4 тис. сімей** (осіб) вразливих категорій, в яких виховується **397,7 тис. дітей,** отримали переважно разові соціальні послуги: консультування, соціальної профілактики, представництва інтересів, соціальної адаптації, соціальної інтеграції та реінтеграції, посередництва (медіації), натуральної допомоги, кризового та екстреного втручання.\n\n##### Серед загальної чисельності отримувачів соціальних послуг переважають: \n\n-   сім\\'ї з дітьми, в яких батьки ухиляються від виконання батьківських обов\\'язків -- **13,7 тис. сімей**\n\n-   сім\\'ї, в яких дітей виховують одинокі матері (батьки) -- **11,6 тис. сімей**\n\n-   сім\\'ї з дітьми, в яких діти постраждали від жорстокого поводження --\n\n##### 48,9 тис. сімей \n\n-   сім\\'ї опікунів/піклувальників, усиновлювачі, прийомні сім\\'ї, дитячі будинки сімейного типу -- **31,8 тис. сімей**\n\n-   внутрішньо переміщені сім\\'ї з дітьми -- **97,4 тис. сімей**\n\n-   сім\\'ї з дітьми військовослужбовців/ветеранів -- **66,9 тис. сімей**\n\n-   сім\\'ї з дітьми, де один чи кілька членів сім\\'ї мають інвалідність -- **52,8 тис. сімей**\n\n>  [ГРАФІК/ДІАГРАМА] \n\n##### Складні життєві обставини за результатами оцінювання потреб підтвердилися у 408,8 тис. сімей (осіб), що становить 48%. \n\n> **Результати роботи з попередження соціального сирітства**\n>\n> Робота з сім'ями з дітьми спрямовується, зокрема, на запобігання відмовам матерів від новонароджених дітей, запобігання вилученню дітей із сімей, повернення дітей з інтернатних закладів до біологічних сімей та надання необхідної підтримки сім'ї, відповідно до виявлених потреб дитини та її родини, з боку соціальних служб, державних інституцій, лікарських установ, найближчого оточення родини.\n>\n> З метою збереження родинного оточення для дитини впродовж 2025 року соціальними послугами охоплено понад **11,6 тис. сімей (в них 21,2 тис. дітей**), у яких був ризик соціального сирітства, переважно загроза відібрання дитини від батьків через неналежне виконання батьками своїх батьківських обов'язків.\n>\n> У результаті наданих соціальних послуг близько **12,2 тис. дітей** залишилися в сім'ях або повернуто в біологічну сім'ю із закладів інституційного догляду та виховання дітей (**57%** від кількості дітей, у яких був ризик соціального сирітства):\n\n-   збережено родину у 69% випадках ризику відібрання дитини від батьків, близько 11 тис. дітей залишилися в сім'ях;\n\n-   977 дітей повернуто до біологічних сімей з інтернатних закладів (19,6% від чисельності дітей, які за заявою батьків були влаштовані на цілодобове перебування);\n\n-   60,5% від загальної чисельності жінок, які мали намір відмовитися від новонародженої дитини, змінили свій намір, 230 новонароджених дітей залишилися в сім'ї.\n\n [ГРАФІК/ДІАГРАМА] \n\n> Профілактика соціального сирітства залишається пріоритетним напрямком захисту прав та інтересів дітей.\n\n##### Соціальна підтримка багатодітних родин\n\n> За оперативною інформацією ДП \"ІОЦ Мінсоцполітики\", у Реєстрі посвідчень батьків багатодітної сім\\'ї та дитини з багатодітної сім\\'ї станом на 31.12.2025 року обліковано **236,9 тис. багатодітних сімей, у яких виховується 799,5 тис. дітей.**\n>\n> Розподіл сімей за кількістю дітей:\n\n-   181,5 тис. сімей, в яких виховується 3-є дітей\n\n-   33,6 тис. сімей -- 4-ро дітей\n\n-   11,9 тис. сімей -- 5-ро дітей\n\n-   4,5 тис. сімей -- 6-ро дітей\n\n-   2,1 тис. сімей -- 7-ро дітей\n\n-   1,0 тис. сімей -- 8-ро дітей\n\n-   514 -- 9-ро дітей\n\n-   559 сімей -- 10 і більше дітей\n\n> Важливим аспектом соціальної підтримки багатодітної родини з боку держави є **присвоєння почесного звання України «Мати-героїня»**, що є визнанням жінок, які народили та виховали до восьмирічного віку п'ять і\n>\n> більше дітей. Служба здійснює повноваження щодо погодження клопотань місцевих органів виконавчої влади на присвоєння багатодітним матерям почесного звання України «Мати-героїня». Зокрема, протягом 2025 року Службою **опрацьовано 850 пакетів документів** на присвоєння багатодітним матерям почесного звання України «Мати-героїня», з них погоджено -- **823** клопотань (96,8%).\n\n##### Забезпечення соціального захисту прав дітей: реалізація соціальних програм \"пакунок малюка\" та \"муніципальна няня\"\n\n> З метою реалізації державної політики з питань соціального захисту сімей з дітьми та підтримки розвитку відповідального батьківства, відповідно до Положення про Державну службу України з питань дітей, затвердженого постановою Кабінету Міністрів України від 29 вересня 2023 р. № 1048 «Деякі питання Державної служби з питань дітей», Служба організовує і проводить роботу з формування відповідального батьківства, підтримки сімей з дітьми, зокрема, шляхом виконання програм «пакунок малюка», «муніципальна няня».\n\n##### Програма «Пакунок малюка» \n\n> Служба на виконання постанов Кабінету Міністрів України від 25.11.2020 № 1180 «Деякі питання надання одноразової натуральної допомоги «пакунок малюка» та від 04.02.2025 № 114 «Деякі питання призначення та виплати грошової компенсації вартості одноразової натуральної допомоги «пакунок малюка» здійснює повноваження щодо забезпечення родин з новонародженими дітьми «пакунком малюка» в натуральній формі або грошовою компенсацією його вартості.\n>\n> Загалом у 2025 році понад **111 тис. батьків** скористалися правом на отримання грошової компенсації «пакунку малюка» на суму понад **861,7 млн грн** та понад **41,8 тис. дітей** забезпечено бейбі-боксами.\n>\n>  [ГРАФІК/ДІАГРАМА] \n>\n> На виконання вимог пунктів 13 та 14 Порядку призначення та виплати грошової компенсації вартості одноразової натуральної допомоги, «пакунок малюка», затвердженого постановою Кабінету Міністрів України від 29.07.2020\n>\n> № 114, Службою протягом 2025 року укладено **1100 додаткових угод** із закладами торгівлі про приєднання до публічного договору про забезпечення монетизації одноразової натуральної допомоги «пакунок малюка», шляхом приєднання до Договору № 01/2025 Про забезпечення монетизації одноразової натуральної допомоги «пакунок малюка» від 10.02.2025, інформацію про які внесено до Переліку закладів торгівлі, розміщеному на офіційному вебсайті Мінсоцполітики.\n>\n> На виконання вимог пункту 15 Порядку надання при народженні дитини одноразової натуральної допомоги «пакунок малюка», затвердженого постановою Кабінету Міністрів України від 25.11.2020 № 1180 Службою забезпечено координацію доставки «пакунків малюка» до закладів охорони здоров'я усіх регіонів України в кількості 36 345 комплектів.\n>\n> Потребу в «пакунках малюка», визначену регіонами на 2025 рік, забезпечено на 100%.\n\n##### Програма «Муніципальна няня» \n\n> З метою соціального захисту сімей з дітьми та підтримки розвитку відповідального батьківства, продовжується реалізація проєкту\n>\n> «муніципальна няня», яким передбачається виплата (компенсація) отримувачу послуги «муніципальна няня» у розмірі прожиткового мінімуму на дітей віком до шести років, встановленого на 1 січня відповідного року, за кожну дитину, яку доглядає муніципальна няня (у 2025 році -- 8000 грн).\n>\n> Постановою Кабінету Міністрів України від 07 червня 2024 р. № 664 «Деякі питання відшкодування вартості послуги з догляду за дитиною\n>\n> «муніципальна няня» на період воєнного стану та протягом трьох місяців після його припинення або скасування» (далі -- Постанова № 664) дію Порядку відшкодування вартості послуги з догляду за дитиною до трьох років\n>\n> «муніципальна няня», затвердженого постановою Кабінету Міністрів України від 30 січня 2019 р. № 68, поширено, зокрема, на внутрішньо переміщених осіб та осіб, які разом із дітьми проживають на територіях, де неможливо забезпечити функціонування закладів дошкільної освіти, розширено категорії дітей, на які поширюється послуга, та обмежено кількість дітей, за якими одночасно здійснюється догляд.\n>\n> За інформацією, наданою регіональними структурними підрозділами з питань соціального захисту населення, станом на 31.12.2025, **1 960 особам призначено компенсацію послуги на 2 151 дитину.**\n\n [ГРАФІК/ДІАГРАМА] \n\n#### 1.3.2. Реалізація державної політики у сфері захисту прав дітей, які опинилися в складних життєвих обставинах \n\n> За даними ЄІАС «Діти», станом на 31.12.2025, на обліку СЖО перебуває понад\n>\n> **66,5 тис. дітей,** у тому числі:\n\n-   зазнали психологічного насильства -- **26 978 дітей**\n\n-   батьки яких або особи, що їх замінюють, ухиляються від виконання своїх обов\\'язків **-- 24 401 дитина**\n\n-   постраждали від обставин стихійного лиха, техногенних аварій, катастроф, воєнних дій чи збройних конфліктів тощо -- **19 060** дітей\n\n-   зазнали або вчинили жорстоке поводження, зокрема, домашнє насильство **-- 1 233 дитини**\n\n-   перебувають у конфлікті із законом -- **480 дітей**\n\n-   переміщені з тимчасово окупованої території або з району проведення антитерористичної операції, які залишилися без батьківського піклування -- **457 дітей**\n\n>  [ГРАФІК/ДІАГРАМА] \n\n##### Влаштування дітей у сім\\'ї патронатних вихователів\n\n> Відповідно до постанови Кабінету Міністрів України від 20 серпня 2021 р. № 893 «Деякі питання захисту прав дитини та надання послуги патронату над дитиною» Службою забезпечено системний моніторинг створення сімей патронатних вихователів, влаштування дітей, які перебувають у складних життєвих обставинах, в сім\\'ї патронатних вихователів.\n>\n> Станом на 01.01.2026, за оперативною інформацією регіональних служб у справах дітей в Україні функціонує **638 сімей** патронатних вихователів, в яких виховується **1 213 дітей** (з них 26 дітей з інвалідністю).\n>\n> Наразі спостерігається стала тенденція до збільшення чисельності сімей патронатних вихователів. Зокрема, упродовж 2025 року **створено 245 патронатних сімей**, що становить 38,4% від загальної кількості таких сімей. 59% дітей, влаштованих до сімей патронатних вихователів -- це діти, які перебувають у складних життєвих обставинах, коли їхні батьки чи законні представники тимчасово не можуть забезпечити їм належний догляд.\n\n##### Основні причини влаштування дітей до сімей патронатних вихователів: \n\n-   залишення дитини в пологовому будинку, іншому медичному закладі -- 2%\n\n-   підкинуті, знайдені діти -- 4%\n\n-   наявність загрози життю та здоров\\'ю дитини -- 21%\n\n-   домашнє насильство, жорстоке поводження з дитиною -- 1%\n\n-   батьки, інші законні представники дитини потребують реабілітації, лікування -- 3%\n\n-   батьки, інші законні представники дитини померли, пропали безвісти -- 2%\n\n-   батьки, інші законні представники дитини перебувають у складних життєвих обставинах -- 59%\n\n-   інші причини -- 8%\n\n> Станом на 31.12.2025 послуга патронату запроваджена у 362 територіальних громадах.\n\n##### Найактивніші регіони з розвитку патронату \n\n> Харківська область -- 63 патронатних сімей, в них 162 дитини Черкаська область -- 57 патронатних сімей, в них 109 дітей Житомирська область -- 49 патронатних сімей, в них 98 дітей Дніпропетровська область -- 44 патронатних сімей, в них 101 дитина\n\n##### Соціальний захист дітей, які залишилися без батьківського піклування в умовах воєнного стану\n\n> З метою виявлення та соціального захисту дітей, залишених без батьківського піклування в умовах воєнного стану, Службою спільно зі службами у справах дітей обласних, Київської міською державними (військовими) адміністраціями здійснюється щоквартальний моніторинг стану соціального захисту дітей, які з різних причин залишилися без батьківського піклування в умовах дії воєнного стану (з початку повномасштабного вторгнення).\n>\n> За результатами аналізу отриманої інформації встановлено, що з початку повномасштабного вторгнення (24.02.2022) територіальними громадами станом на кінець 2025 року обліковано близько **29,2 тис. таких дітей,** у тому числі у зв'язку з обставинами агресії рф проти України (смерть, загибель батьків, відсутність зв'язку з батьками).\n>\n> Із загальної чисельності облікованих дітей, які залишилися без батьківського піклування, згідно з рішеннями органу опіки та піклування **23,1 тис. дітям (79,3%) установлено статус дитини-сироти або дитини, позбавленої батьківського піклування**. З яких, за результатами вжитих заходів соціального захисту , станом на 31.12.2025:\n\n-   1872 дітей -- усиновлено;\n\n-   14723 дитини -- влаштовано в сім'ї опікунів / піклувальників;\n\n-   2702 дітей -- влаштовані до ПС / ДБСТ;\n\n-   798 дітей -- влаштовано до закладів інституційного догляду та виховання дітей;\n\n-   1023 дитини -- тимчасово влаштовано в сім'ї родичів / знайомих до прийняття рішення про постійну форму влаштування;\n\n-   534 дітей -- влаштовано до ЦСПРД, притулків для дітей;\n\n-   109 дітей -- влаштовано до закладів, створено ГО, БФ;\n\n-   162 дітей -- влаштовано в сім'ї патронатного вихователя тощо.\n\n> Служба, відповідно до пункту 14 Порядку надання статусу дитини, яка постраждала внаслідок воєнних дій та збройних конфліктів, затвердженого постановою Кабінету Міністрів України від 05.04.2017 р. № 268, забезпечує щоквартальний моніторинг інформації про кількість дітей, яким надано Статус, поданої службами у справах дітей обласних, Київської міської державних (військових) адміністрацій.\n>\n> **За оперативною інформацією регіональних служб у справах дітей станом на 01.01.2026 року близько 461,1 тис. дітей отримали Статус дитини, яка постраждала внаслідок воєнних дій та збройних конфліктів,** у т. ч. близько **148,5 тис.** дітей, які перебувають на обліку як внутрішньо переміщені особи (відповідно до Порядку надання статусу дитини, яка постраждала внаслідок воєнних дій та збройних конфліктів, затвердженим постановою Кабінету Міністрів України від 05.04.2017 № 268 (зі змінами).\n>\n> Із **461,1 тис.** дітей:\n\n-   14 дітей -- залучались до участі у діях воєнізованих чи збройних формувань;\n\n-   24 дитини -- були викрадені або незаконно вивезені за межі України;\n\n-   72 дитини -- незаконно утримувалися, у тому числі у полоні;\n\n-   103 дитини -- зазнали фізичного, сексуального насильства;\n\n-   328 дітей -- були позбавлені батьківського піклування внаслідок воєнних дій та збройних конфліктів;\n\n-   567 дітей -- отримали поранення, контузію, каліцтво;\n\n-   3138 дітей -- батьки яких або один з них, інший законний представник зникли безвісти за особливих обставин або померли (загинули) через отримані внаслідок воєнних дій та збройних конфліктів поранення, контузії або каліцтва на території України чи за кордоном;\n\n-   близько 451,1 тис. дітей -- зазнали психологічного насильства (98,8% від загальної кількості);\n\n-   16 дітей -- надано Статус з інших причин.\n\n> Відомості про дітей цієї категорії вносяться службами у справах дітей до ЄІАС\n>\n> «Діти». Постраждалим внаслідок воєнних дій та збройних конфліктів дітям, за результатами проведення оцінки потреб родини/особи, центри соціальних служб і служби у справах дітей надають системну та різнобічну допомогу: близько **146,0 тис. дітей отримали соціальні послуги відповідно до їхніх потреб.**\n\n##### Реалізація державної політики у сфері оздоровлення та відпочинку дітей\n\n##### Організація оздоровлення та відпочинку дітей\n\n> Зміцнення здоров'я дітей шляхом організації оздоровлення та відпочинку, створення оптимальних умов для безпечного та ефективного їх перебування у дитячих закладах визначено одним із основних завдань та соціальних пріоритетів державної політики.\n>\n> За інформацією регіонів, в Україні **2 477 дитячих закладів оздоровлення та відпочинку,** в тому числі з денним перебуванням (пришкільні табори), які надавали оздоровчі та відпочинкові послуги у 2025 році.\n>\n> Фінансове забезпечення на підготовку та проведення оздоровчої кампанії у 2025 році становить **1 195 603 тис. грн.** З них:\n\n-   з обласних бюджетів -- 160 579,4 тис. грн.\n\n-   з місцевих бюджетів -- 1 035 023,6 тис. грн.\n\n> Під час проведення оздоровчої кампанії, охоплено оздоровленням та відпочинком близько **354,7 тис. дітей шкільного віку** (від 7 до 18 років), з них:\n\n-   оздоровленням -- 42,0 тис. дітей\n\n-   відпочинком -- 312,7 тис. дітей\n\n> У тому числі упродовж звітного року фактично отримали послуги з оздоровлення та відпочинку -- **241,3 тис. дітей пільгових категорій,** що складає 10,8 % від загальної кількості таких дітей.\n>\n> З них переважна більшість дітей належать до таких категорій:\n\n-   діти осіб, визнаних учасниками бойових дій -- 54 685 дітей\n\n-   діти з багатодітних сімей -- 39 689 дітей\n\n-   талановиті та обдаровані діти -- 34 658 дітей\n\n-   діти, зареєстровані як внутрішньо переміщені особи -- 28 744 дитини\n\n-   діти --- учасники дитячих творчих колективів та спортивних команд -- 13 418 дітей\n\n-   діти-сироти, діти, позбавлені батьківського піклування -- 12 269 дітей\n\n-   діти з малозабезпечених сімей -- 10 945 дітей\n\n-   діти, які перебувають на диспансерному обліку -- 10 387 дітей\n\n-   діти, один із батьків яких загинув (пропав безвісти) у районі проведення бойових дій -- 9 535 дітей\n\n-   діти інших пільгових категорій -- 26 926 дітей\n\n> Відповідно до постанови Кабінету Міністрів України від 10 листопада 2025 року № 1435 Службою проведено перевірку інформації про дітей, яким надавалися послуги з оздоровлення та відпочинку, отриманої від Фонду соціального захисту осіб з інвалідністю, стосовно ненадання їм у 2025 році путівки уповноваженими органами виконавчої влади, органами місцевого самоврядування до державного підприємства «Міжнародний дитячий центр\n>\n> «Артек» коштів державного або місцевого бюджету. Зокрема, здійснено звірку інформації стосовно 2708 дітей, які мали змогу оздоровитися протягом листопада-грудня у 5 закладах, розташованих у західних регіонах.\n\n##### Оздоровлення в дитячому центрі «Артек» \n\n> Службою забезпечено формування розподілу путівок до дитячого центру\n>\n> «Артек» у розрізі адміністративно-територіальних одиниць відповідно до потреб обласних, Київської міської державних (військових) адміністрацій.\n>\n> Протягом 2025 року в дитячому центрі «Артек» фактично оздоровлено **14 358**\n>\n> дітей пільгових категорій (98,7% від запланованих).\n>\n> Першочергово забезпечено потребу в путівках для дітей з 9 регіонів, а саме: Дніпропетровська, Донецька, Запорізька, Луганська, Миколаївська, Одеська, Сумська, Харківська, Херсонська області.\n>\n> Найбільше охоплено послугою з оздоровлення дітей, які належать до таких категорій:\n\n-   діти осіб, визнаних учасниками бойових дій -- 44,91%;\n\n-   діти-сироти, діти, позбавлені батьківського піклування -- 23,35%;\n\n-   діти, зареєстровані як внутрішньо переміщені особи -- 12,22%;\n\n-   діти інших пільгових категорій, визначених статтею 1 Закону України\n\n> «Про оздоровлення та відпочинок дітей» -- 19,52%.\n\n##### Ведення Державного реєстру майнових об'єктів оздоровлення та відпочинку дітей\n\n> З метою забезпечення доступності та відкритості інформації про дитячі заклади оздоровлення та відпочинку і послуги, які надаються такими закладами, функціонує Державний реєстр майнових об'єктів оздоровлення та відпочинку дітей.\n>\n> Наразі в Реєстрі містяться дані про **355 дитячих закладів оздоровлення та відпочинку** державної, комунальної та приватної форми власності, з яких щодо повноти внесених даних перевірено **67 закладів,** які надавали послуги оздоровлення та відпочинку у 2025 році.\n\n##### Організація проведення державної атестації дитячих закладів оздоровлення та відпочинку\n\n> Службою здійснюється координація роботи за проведенням державної атестації дитячих закладів оздоровлення та відпочинку і присвоєння їм відповідних категорій, надання відповідної методичної допомоги, облік та оприлюднення результатів проведення атестації.\n>\n> Відповідно до Планів проведення державної атестації дитячих закладів оздоровлення та відпочинку обласними та Київською міською державними (військовими) адміністраціями у 2025 році було заплановано проведення державної атестації 38 дитячих закладів оздоровлення та відпочинку всіх форм власності.\n>\n> За результатами підсумків державної атестації встановлено, що проведено державну атестацію **24 дитячих закладів оздоровлення та відпочинку** всіх форм власності, з яких вищу категорію присвоєно **13 закладам,** першу категорію -- **8 закладам,** другу категорію -- **2 закладам** та, у зв'язку з невідповідністю державним соціальним стандартам оздоровлення та відпочинку дітей, які можуть вплинути на безпеку і стан здоров'я дітей, **1 заклад** був не атестований.\n>\n> Також **14 закладів**, у яких було заплановано проведення державної атестації у 2025 році, не проходили атестацію, оскільки не надавали послуги дітям з оздоровлення та відпочинку протягом року.\n>\n> Результати проведення державної атестації дитячих закладів оздоровлення та відпочинку в 2025 році, оприлюднено на вебсайті Служби в розділі\n>\n> «Програми підтримки дітей і сімей» у рубриці «Оздоровлення та відпочинок дітей».\n\n# ВИКОРИСТАННЯ КОШТІВ ДЕРЖАВНОГО БЮДЖЕТУ\n\n> За бюджетною програмою **КПКВК 2504010** «Керівництво та управління у сфері усиновлення та захисту прав дітей», відповідно до Закону України «Про державний бюджет України на 2025 рік», затверджено кошторисні призначення за загальним фондом державного бюджету в розмірі **43 583 300,00 грн**, з яких:\n\n-   видатки на оплату праці з нарахуваннями на оплату праці -- 40 928 900,00 грн;\n\n-   оплата комунальних послуг та енергоносіїв -- 1 146 800,00 грн;\n\n-   товари та послуги, видатки на відрядження -- 1 441 584,00 грн;\n\n-   інші поточні видатки (судовий збір) -- 66 016,00 грн.\n\n> За 2025 рік касові видатки становлять -- 40 757 821,88 грн, з яких:\n\n-   видатки на оплату праці з нарахуваннями на оплату праці -- 39 099 901,46 грн;\n\n-   оплата комунальних послуг та енергоносіїв -- 369 109,45 грн;\n\n-   товари та послуги, видатки на відрядження -- 1 224 007,27 грн;\n\n-   інші поточні видатки (судовий збір) -- 64 803,70 грн.\n\n> Залишок невикористаних кошторисних призначень (економія коштів) -- 1 984 374,12 грн, в тому числі: на оплату праці з нарахуванням на оплату праці у сумі 1 828 998,54 грн виник через наявність вакантних посад та плинність кадрів. Також 610 000,00 грн було перерозподілено Національній соціальній сервісній службі України.\n>\n> У 2025 році було укладено 21 господарський договір, здійснено всі розрахунки з контрагентами. На кінець 2025 року дебіторська та кредиторська заборгованість відсутні.\n>\n> За рахунок інших поточних видатків придбано канцелярське приладдя, бланки службових посвідчень, комп'ютерне та мережеве обладнання, друковану продукцію, відшкодування комунальних послуг балансоутримувачу орендованого майна, здійснено оплату за послуги з доступу до мережі Інтернет, електронних телекомунікаційних послуг,\n>\n> експертизи технічного стану засобів, СЕД АСКОД, утилізації непридатних засобів та заправки картриджів для забезпечення повноцінної роботи працівників Служби.\n>\n> У 2025 році було отримано благодійну допомогу на безоплатній основі у натуральному вигляді (картриджи, папір, стільці та крісла офісні, столи, моноблоки, принтери, джерела безперебійного живлення, монітори, програмне забезпечення Microsoft Ofﬁce, ноутбуки, багатофункціональні пристрої, комутатори) та внесено відповідні зміни до кошторису по спеціальному фонду за КПКВК 2504010 на загальну суму 3 847 728,00 грн.\n>\n> За бюджетною програмою **КПКВК 2501400** «Соціальний захист дітей та сім'ї», відповідно до Закону України «Про державний бюджет України на 2025 рік», за загальним фондом передбачено кошторисні призначення у розмірі 1 269 132 661,00 грн, з яких:\n\n-   предмети, матеріали, обладнання та інвентар -- 437 338 100,00 грн;\n\n-   оплата послуг (крім комунальних) -- 2 186 700,00 грн;\n\n-   інші виплати населенню -- 829 607 861,00 грн.\n\n> Касові видатки за 2025 рік становлять -- 1 102 308 427,69 грн, а саме:\n\n-   предмети, матеріали, обладнання та інвентар -- 279 456 705,00 грн;\n\n-   оплата послуг (крім комунальних) -- 1 397 283,53 грн;\n\n-   інші виплати населенню -- 821 454 439,16 грн.\n\n> Залишок невикористаних кошторисних призначень (економія коштів) - 8 153 422,31 грн, виник після здійснення повної оплати за сумами договорів.\n>\n> Було укладено 2 господарські договори (послуги з організації та проведення процедури закупівлі «Пакунків малюка», закупівля товарів за державні кошти (комплекти одноразової натуральної допомоги «Пакунок малюка») та здійснено всі розрахунки з контрагентами. На кінець 2025 року дебіторська та кредиторська заборгованість відсутні.\n>\n> Грошової компенсації одноразової допомоги «Пакунок малюка» у 2025 році було виплачено на загальну суму - 861 749 688,00 грн.\n>\n> Підйомної допомоги, пов'язаної із забезпеченням здійснення заходів з повернення дитини, яка депортована або примусово переміщена, або перебуває під ризиком депортації та/або примусового переміщення внаслідок збройної агресії російської федерації проти України, або особи\n>\n> з-поміж дітей, які депортовані або примусово переміщені, або перебувають під ризиком депортації та/або примусового переміщення внаслідок збройної агресії російської федерації проти України, з серпня 2025 року виплачено на суму 11 400 000,00 грн.\n\n# ОРГАНІЗАЦІЙНА ІНФОРМАЦІЯ\n\n## Структура та кадрове забезпечення\n\n> Станом на 31.12.2025 штатна чисельність Служби становила 80 одиниць. Фактична чисельність становила 58 державних службовців (14 чоловіків, 44 жінки), що в свою чергу складає 72,5% укомплектованості посад у чинному штатному розписі.\n\n##### Вікова характеристика \n\n> Середній вік працівників становить -- 41 рік Наймолодшому працівникові -- 21 рік Найстаршому працівникові -- 61 рік\n>\n> Протягом року забезпечено підвищення рівня професійної компетентності 85 % державних службовців за загальними професійними (сертифікатними) та короткостроковими програмами\n>\n> Кадровий склад Служби характеризується поєднанням професійного досвіду та потенціалу молодих фахівців, що забезпечує інституційну сталість і водночас сприяє впровадженню сучасних підходів у роботі.\n>\n>  [ГРАФІК/ДІАГРАМА] \n\n# НОРМАТИВНО-ПРАВОВА ДІЯЛЬНІСТЬ\n\n## Опрацювання нормативно-правових актів\n\n> У 2025 році було опрацьовано 47 нормативно-правових актів, з них:\n\n-   у кількості 30 НПА -- погоджено без зауважень\n\n-   у кількості 17 НПА -- погоджено з зауваженнями, Службою надано свої пропозиції\n\n## Участь у робочих групах\n\n-   робоча група з підготовки проєкту Закону України «Про внесення змін до деяких законів України щодо підтримки сімей з дітьми та створення умов, які сприяють поєднанню батьківства з професійною діяльністю»\n\n-   конкурсна комісія для проведення відбору кандидатів до складу Офісу дітей та молоді «ДІйМО»\n\n-   робоча група з розробки порядку захисту житлових і майнових прав дітей-сиріт та дітей, позбавлених батьківського піклування, та осіб з їх числа (наказ Служби від 16.04.2025 № 28-ОС)\n\n## Опрацювання законопроєктів\n\n> Службою опрацьовано 4 законопроєкти, а саме:\n\n-   Про погодження проєкту Закону України «Про внесення змін до деяких законів України щодо підтримки сімей з дітьми та створення умов, які сприяють поєднанню батьківства з професійною діяльністю»\n\n-   Про погодження проєкту Закону України «Про цифрову доступність інформаційно-комунікаційних систем, онлайн-ресурсів та електронних послуг»\n\n-   Про погодження проєкту Закону України «Про внесення зміни до статті 7 Закону України «Про дипломатичну службу»\n\n-   Про погодження проєкту Закону України «Про внесення змін до деяких законодавчих актів у зв\\'язку із ратифікацією Конвенції Ради Європи про запобігання насильству щодо жінок та домашньому насильству та боротьбу з цими явищами»\n";
const charts=(()=>{
// Діаграми в стилі звіту 2025: кільцева (donut) з легендою, горизонтальні стовпчики, «півколо»-показники.
// SVG -> PNG через @resvg/resvg-js.

const PALETTE = ['#8AB645', '#D5D94B', '#F2CD45', '#62A8DE', '#E3903A', '#9B7BC8', '#4DB6AC', '#C9637A'];
const FONT = "Montserrat, 'Segoe UI', Arial, Helvetica, sans-serif";

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const fmt = n => Number(n).toLocaleString('uk-UA').replace(/ /g, ' ');
const pct = (v, t) => (t ? Math.round((v / t) * 1000) / 10 : 0).toString().replace('.', ',') + '%';

function wrap(text, max) {
  const words = String(text).split(/\s+/); const lines = []; let cur = '';
  for (const w of words) { if ((cur + ' ' + w).trim().length > max) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }
  if (cur) lines.push(cur); return lines;
}

function donutSvg({ title, items, unit = '', total }) {
  const W = 1200, rowH = 60;
  const sum = items.reduce((a, b) => a + (+b.value || 0), 0) || 1;
  const H = Math.max(520, 160 + items.length * rowH + 80);
  const cx = 300, cy = H / 2 + 10, R = 230, r = 112;
  let a0 = -Math.PI / 2, svg = '', labels = '';
  items.forEach((it, i) => {
    const v = +it.value || 0, a1 = a0 + (v / sum) * Math.PI * 2, large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
    const [x0, y0] = p(R, a0), [x1, y1] = p(R, a1), [x2, y2] = p(r, a1), [x3, y3] = p(r, a0);
    if (v > 0) {
      const full = v / sum > 0.9999;
      svg += full
        ? `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="${PALETTE[i % 8]}" stroke-width="${R - r}"/>`
        : `<path d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z" fill="${PALETTE[i % 8]}"/>`;
      const am = (a0 + a1) / 2, [lx, ly] = p(R + 42, am);
      if (v / sum >= 0.015) labels += `<text x="${lx}" y="${ly + 8}" text-anchor="middle" font-size="26" font-weight="700" fill="#111">${pct(v, sum)}</text>`;
    }
    a0 = a1;
  });
  let legend = `<text x="640" y="80" font-size="30" font-weight="700" fill="#111">${esc(title || 'Із загальної кількості:')}</text>`;
  items.forEach((it, i) => {
    const y = 130 + i * rowH;
    legend += `<rect x="640" y="${y}" width="34" height="34" fill="${PALETTE[i % 8]}"/>` +
      `<text x="692" y="${y + 27}" font-size="26" fill="#111">${esc(it.label)} – ${fmt(it.value)}${unit ? ' ' + esc(unit) : ''}</text>`;
  });
  const ly = 130 + items.length * rowH + 20;
  legend += `<line x1="640" x2="1170" y1="${ly}" y2="${ly}" stroke="#777" stroke-dasharray="2 4"/>` +
    `<text x="700" y="${ly + 46}" font-size="28" font-weight="700" fill="#111">Загалом: ${fmt(total ?? sum)}${unit ? ' ' + esc(unit) : ''}</text>`;
  return { W, H, body: svg + labels + legend };
}

function barSvg({ title, items, unit = '' }) {
  const W = 1200, rowH = 54, top = title ? 90 : 30, H = top + items.length * rowH + 30;
  const max = Math.max(...items.map(i => +i.value || 0), 1), labW = 420, barMax = W - labW - 190;
  let body = title ? `<text x="30" y="55" font-size="30" font-weight="700" fill="#111">${esc(title)}</text>` : '';
  items.forEach((it, i) => {
    const y = top + i * rowH, w = Math.max(2, ((+it.value || 0) / max) * barMax);
    body += `<text x="${labW - 14}" y="${y + 30}" text-anchor="end" font-size="24" fill="#111">${esc(it.label)}</text>` +
      `<rect x="${labW}" y="${y + 6}" width="${w}" height="36" rx="4" fill="${PALETTE[0]}"/>` +
      `<text x="${labW + w + 12}" y="${y + 32}" font-size="24" font-weight="700" fill="#111">${fmt(it.value)}${unit ? ' ' + esc(unit) : ''}</text>`;
  });
  return { W, H, body };
}

// items: [{percent:69.6, caption:'мають братів, сестер…', color?}]
function gaugesSvg({ items }) {
  const n = Math.min(items.length, 3), colW = 1200 / n, H = 380; let body = '';
  items.slice(0, n).forEach((it, i) => {
    const cx = colW * i + colW / 2, cy = 190, R = 150, w = 34, p = Math.max(0, Math.min(100, +it.percent || 0)) / 100;
    const col = it.color || PALETTE[(i * 2) % 8];
    const pt = (a) => [cx + R * Math.cos(Math.PI + a * Math.PI), cy + R * Math.sin(Math.PI + a * Math.PI)];
    const [sx, sy] = pt(0), [ex, ey] = pt(1), [mx, my] = pt(p);
    body += `<path d="M${sx},${sy} A${R},${R} 0 0 1 ${ex},${ey}" stroke="#E6E6D8" stroke-width="${w}" fill="none" stroke-linecap="round"/>` +
      (p > 0 ? `<path d="M${sx},${sy} A${R},${R} 0 0 1 ${mx},${my}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>` : '') +
      `<text x="${cx}" y="${cy + 6}" text-anchor="middle" font-size="76" fill="#111">${String(it.percent).replace('.', ',')} %</text>`;
    wrap(it.caption, 30).slice(0, 4).forEach((ln, k) => {
      body += `<text x="${cx}" y="${cy + 70 + k * 36}" text-anchor="middle" font-size="28" fill="#111">${esc(ln)}</text>`;
    });
  });
  return { W: 1200, H, body };
}

function buildSvg(chart) {
  const items = (chart.items || []).filter(i => i && i.label != null);
  let r;
  if (chart.kind === 'gauges') r = gaugesSvg({ items: chart.items || [] });
  else if (!items.length) return null;

function parseUrl(url) {
  const id = (/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/.exec(url) || [])[1];
  const gid = (/[?#&]gid=(\d+)/.exec(url) || [])[1] || '0';

// Мінімальний CSV-парсер (лапки, коми та переноси всередині комірок)
function parseCsv(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }

  while (rows.length && rows[rows.length - 1].every(v => v.trim() === '')) rows.pop();

  rows.forEach(r => { for (let i = r.length - 1; i >= 0; i--) if (r[i].trim() !== '') { maxCol = Math.max(maxCol, i + 1); break; } });
  return rows.map(r => r.slice(0, maxCol));
}

async function fetchText(url, timeoutMs = 30000) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
    return await res.text();
  } finally { clearTimeout(t); }
}

async function fetchTabCsv(id, gid) {
  const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}`;
  const text = await fetchText(url);
  if (/^\s*<(!doctype|html)/i.test(text)) {
    throw new Error('Таблиця закрита. Відкрийте доступ «Усі, хто має посилання → Читач» (або вкажіть Google API key у налаштуваннях).');
  }
  return parseCsv(text);
}

async function listTabsViaApi(id, apiKey) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${id}?fields=sheets.properties(sheetId,title)&key=${encodeURIComponent(apiKey)}`;
  const json = JSON.parse(await fetchText(url));

/**
 * @returns {Promise<{fetchedAt:string, hash:string, spreadsheetId:string, tabs:{gid:string,title:string,rows:string[][]}[], errors:string[]}>}

async function fetchSpreadsheet({ url, extraGids = [], apiKey = '' }) {

  const isNum = i => rows.length && rows.every(r => /^[\d\s.,%+\-–—]*$/.test(String(r[i] ?? '')) );
  const cell = (txt, w, { head, fill, bold, align }) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="${fill}"/><w:vAlign w:val="center"/></w:tcPr><w:p><w:pPr><w:pStyle w:val="TableParagraph"/><w:spacing w:before="40" w:after="40"/><w:jc w:val="${align}"/></w:pPr>${runs(txt, { size: head ? 22 : 20, color: head ? 'FFFFFF' : undefined, boldAll: head || bold, tahomaAll: head })}</w:p></w:tc>`;
  const head = `<w:tr><w:trPr><w:trHeight w:val="600" w:hRule="atLeast"/><w:tblHeader/><w:cantSplit/></w:trPr>${columns.map((c, i) => cell(c, widths[i], { head: true, fill: C.orange, align: 'center' })).join('')}</w:tr>`;
  const body = rows.map((r, ri) => {
    const bold = /^(всього|разом|загалом)/i.test(String(r[0] ?? '')) || /^(всього|разом|загалом)/i.test(String(r[1] ?? ''));
    return `<w:tr><w:trPr><w:trHeight w:val="440" w:hRule="atLeast"/><w:cantSplit/></w:trPr>${columns.map((_, i) => cell(r[i] ?? '', widths[i], { fill: ri % 2 ? 'FFFFFF' : C.rowFill, bold, align: i === 0 && /^№$/.test(columns[0]) ? 'center' : isNum(i) ? 'center' : 'left' })).join('')}</w:tr>`;
  }).join('');
  const b = '<w:%s w:val="single" w:sz="8" w:space="0" w:color="000000"/>';
  const tbl = `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a, b) => a + b, 0)}" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>${['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map(n => b.replace('%s', n)).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="100" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar><w:tblLook w:val="01E0"/></w:tblPr><w:tblGrid>${widths.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${head}${body}</w:tbl>`;
  return (caption ? pSub(caption) : '') + `<w:p><w:pPr><w:pStyle w:val="BodyText"/><w:spacing w:before="0" w:after="0" w:line="120" w:lineRule="exact"/></w:pPr></w:p>` + tbl + pEmpty();
}

function imageParagraph(rId, id, wPx, hPx) {
  const maxW = 5200000; // ~14,4 см, як у шаблоні
  const cx = maxW, cy = Math.round(maxW * hPx / wPx);
  return `<w:p><w:pPr><w:keepLines/><w:spacing w:before="160" w:after="160" w:line="240" w:lineRule="auto"/><w:ind w:left="1157" w:right="1178"/><w:jc w:val="center"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${id}" name="Діаграма ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="chart${id}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}

// ---------- зміст (поле Word + кешований список без номерів сторінок) ----------
function tocXml(outline) {
  const instr = ' TOC \\h \\z \\t "Heading 1,1,Heading 2,2,Heading 5,3" ';
  const entry = (e, i) => {
    const st = 'TOC' + e.level;
    const ind = e.level === 1 ? 1157 : e.level === 2 ? 1500 : 1877;
    const pre = i === 0 ? `<w:r><w:fldChar w:fldCharType="begin" w:dirty="true"/></w:r><w:r><w:instrText xml:space="preserve">${instr}</w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r>` : '';
    const post = i === outline.length - 1 ? '<w:r><w:fldChar w:fldCharType="end"/></w:r>' : '';
    const label = (e.num ? e.num + ' ' : '') + e.text;
    return `<w:p><w:pPr><w:pStyle w:val="${st}"/><w:spacing w:before="60"/><w:ind w:left="${ind}" w:right="1178"/></w:pPr>${pre}<w:r><w:rPr>${e.level === 1 ? '<w:rFonts w:ascii="Tahoma" w:hAnsi="Tahoma"/><w:b/>' : '<w:b w:val="0"/>'}<w:i w:val="0"/><w:sz w:val="22"/></w:rPr>${T(label)}</w:r>${post}</w:p>`;
  };
  return outline.length ? outline.map(entry).join('') : '';
}

// ---------- головна функція ----------
/**
 * @param report  JSON від ШІ: { sections:[{level,heading,unnumbered?,blocks:[...]}] }
 * @param opts    { year, periodText, onWarn }
 * @returns Buffer (.docx)
 */
async function buildDocx(report, opts = {}) {
  const warn = opts.onWarn || (() => {});
  const zip = await JSZip.loadAsync(TEMPLATE_B64, { base64: true });
  const docXml = await zip.file('word/document.xml').async('string');
  const bodyStart = docXml.indexOf('<w:body>') + '<w:body>'.length;
  const head = docXml.slice(0, bodyStart);
  const els = docXml.slice(bodyStart).match(/<w:p[ >].*?<\/w:p>|<w:tbl>.*?<\/w:tbl>|<w:sectPr.*?<\/w:sectPr>/gs);

  // титулка: елементи до першого розриву розділу включно
  const firstSect = els.findIndex(e => e.includes('<w:sectPr'));
  const secondSect = els.findIndex((e, i) => i > firstSect && e.includes('<w:sectPr'));
  let front = els.slice(0, firstSect + 1);
  const periodText = opts.periodText || `за ${opts.year || new Date().getFullYear()} рік`;
  front = front.map(e => /за.*?2025|<w:t[^>]*>рік<\/w:t>/s.test(e) && /w:val="32"/.test(e) && !e.includes('sectPr') && /рік/.test(e.replace(/<[^>]+>/g, ''))
    ? e.replace(/<w:r>.*<\/w:r>/s, `<w:r><w:rPr><w:rFonts w:ascii="Tahoma" w:hAnsi="Tahoma"/><w:b/><w:sz w:val="32"/></w:rPr>${T(periodText)}</w:r>`)
    : e);
  const spacers = els.slice(firstSect + 1, firstSect + 5); // порожні абзаци перед змістом, як у шаблоні
  const tocSect = els[secondSect].match(/<w:sectPr>.*<\/w:sectPr>/s)[0];
  const bodySect = tocSect.replace(/<w:pgNumType[^>]*\/>/, '').replace('<w:pgSz', '<w:type w:val="nextPage"/><w:pgSz');

  // тіло
  const rels = [];
  let imgId = 100, body = '', n1 = 0, n2 = 0, n3 = 0;
  const outline = [];
  const sections = Array.isArray(report.sections) ? report.sections : [];
  for (const s of sections) {
    const lvl = Math.min(3, Math.max(1, +s.level || 1));
    let num = '';
    if (!s.unnumbered) {
      if (lvl === 1) { n1++; n2 = 0; n3 = 0; num = `${n1}.`; }
      else if (lvl === 2) { n2++; n3 = 0; num = `${n1}.${n2}.`; }
      else { n3++; num = `${n1}.${n2}.${n3}.`; }
    }
    outline.push({ level: lvl, text: lvl === 1 ? String(s.heading).toUpperCase() : s.heading, num });
    body += heading(lvl, s.heading, { unnumbered: !!s.unnumbered, pageBreak: lvl === 1 });
    let prevBullet = false;
    for (const b of s.blocks || []) {
      if (!b) continue;
      try {
        if (b.type === 'p') { body += pBody(b.text); prevBullet = false; }
        else if (b.type === 'subheading') { body += pSub(b.text); prevBullet = false; }
        else if (b.type === 'bullets') { (b.items || []).forEach((t, i) => { body += pBullet(t, i === 0); }); }
        else if (b.type === 'table' && Array.isArray(b.columns) && b.columns.length) {
          body += table({ columns: b.columns, rows: (b.rows || []).map(r => Array.isArray(r) ? r : [r]), caption: b.caption });
        } else if (b.type === 'chart') {
          const img = await renderChart(b).catch(e => { warn(`Діаграму «${b.title || b.kind}» пропущено: ${e.message}`); return null; });
          if (img) {
            const rId = 'rIdChart' + (++imgId), file = `media/chart${imgId}.png`;
            zip.file('word/' + file, img.png);
            rels.push(`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="${file}"/>`);
            body += imageParagraph(rId, imgId, img.width, img.height);
          }
        }
      } catch (e) { warn(`Блок «${b.type}» пропущено: ${e.message}`); }
    }
  }

  const newDoc = head + front.join('') + spacers.join('') + tocXml(outline) +
    `<w:p><w:pPr><w:pStyle w:val="BodyText"/>${tocSect}</w:pPr></w:p>` + body + bodySect + '</w:body></w:document>';
  zip.file('word/document.xml', newDoc);

  // rels: лишаємо стилі/шрифти/тему/налаштування/нумерацію/header/footer + титульна картинка; прибираємо старі діаграми та посилання змісту
  let relXml = await zip.file('word/_rels/document.xml.rels').async('string');
  const keepRel = r => !/Type="[^"]*\/(hyperlink)"/.test(r) && !(/\/image"/.test(r) && !/Id="rId5"/.test(r));
  relXml = relXml.replace(/<Relationship [^>]*\/>/g, r => (keepRel(r) ? r : '')).replace('</Relationships>', rels.join('') + '</Relationships>');
  zip.file('word/_rels/document.xml.rels', relXml);
  const usedImages = new Set((relXml.match(/media\/[^"]+/g) || []).map(m => 'word/' + m));
  // header1 теж посилається на картинку
  const hRel = await zip.file('word/_rels/header1.xml.rels').async('string');
  (hRel.match(/media\/[^"]+/g) || []).forEach(m => usedImages.add('word/' + m));
  Object.keys(zip.files).filter(f => f.startsWith('word/media/') && !f.endsWith('/') && !usedImages.has(f) && !/chart\d+\.png$/.test(f)).forEach(f => zip.remove(f));

  // Content types: png
  let ct = await zip.file('[Content_Types].xml').async('string');
  if (!/Extension="png"/i.test(ct)) ct = ct.replace('<Default Extension="rels"', '<Default Extension="png" ContentType="image/png"/><Default Extension="rels"');
  zip.file('[Content_Types].xml', ct);

  // settings: попросити Word оновити зміст (номери сторінок) при відкритті
  let st = await zip.file('word/settings.xml').async('string');
  if (!st.includes('w:updateFields')) st = st.replace(/(<w:zoom[^>]*\/>)/, '$1<w:updateFields w:val="true"/>');
  zip.file('word/settings.xml', st);

  return zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', compression: 'DEFLATE' });
}


return {buildDocx};
})();

const $=i=>document.getElementById(i), esc2=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF={url:'https://docs.google.com/spreadsheets/d/1BVgm96B3eZpaAfmanmzMx98-V7XeIm99lz_Jd9h7JDU/edit?gid=843885213#gid=843885213',gids:'',year:2026,key:'',prov:'gemini',model:'gemini-3.8-flash',period:''};

$('save').onclick=()=>{S={url:$('s_url').value.trim(),gids:$('s_gids').value.trim(),year:+$('s_year').value||2026,key:$('s_key').value.trim(),prov:$('s_prov').value,model:$('s_model').value.trim()||(($('s_prov').value==='gemini')?'gemini-3.8-flash':'claude-sonnet-5-5'),period:$('s_period').value.trim()};try{localStorage.setItem('zvit',JSON.stringify(S))}catch(e){}loadForm();manual=false;refresh()};
$('csv').onchange=async e=>{const tabs=[];for(const f of e.target.files)tabs.push({gid:f.name,title:f.name,rows:sheets.parseCsv(await f.text())});if(tabs.length){snapshot={fetchedAt:new Date().toISOString(),hash:'manual',tabs,errors:[]};manual=true;fetchedAt=snapshot.fetchedAt;lastChange=fetchedAt;lastError='';render()}};
async function refresh(){ if(busy||manual)return; busy=true;
 try{const gids=S.gids.split(/[,\s]+/).filter(Boolean);const snap=await sheets.fetchSpreadsheet({url:S.url,extraGids:gids});
  if(!snapshot||snapshot.hash!==snap.hash)lastChange=new Date().toISOString();snapshot=snap;fetchedAt=snap.fetchedAt;lastError=snap.errors.join('\n');}
 catch(e){lastError=e.message+(/fetch|Failed|network/i.test(e.message)?'\n\nБраузер не зміг завантажити таблицю. Перевірте, що доступ відкрито («Усі, хто має посилання → Читач»), або завантажіть вкладки вручну як CSV у «Налаштуваннях».':'')}
 finally{busy=false;render()}}
function render(extra){
 const t=fetchedAt?new Date(fetchedAt).toLocaleTimeString('uk-UA'):'—';
 $('meta').innerHTML='<span class="dot"></span>Оновлено: '+t+(manual?' (вручну)':' (автооновлення щохвилини)')+(lastChange?' · остання зміна даних: '+new Date(lastChange).toLocaleTimeString('uk-UA'):'');
 const e=$('err');e.style.display=lastError?'block':'none';e.textContent=lastError;
 $('gen').disabled=gen;$('gen').textContent=gen?'⏳ Формується…':'📄 Сформувати звіт (Word)';

function job(html,cls){const j=$('jobbox');j.className='box '+(cls||'');j.style.display=html?'block':'none';j.innerHTML=html||''}
$('ref').onclick=()=>{manual=false;refresh()};
$('gen').onclick=async()=>{ if(gen)return; if(!S.key){$('settings').open=true;job('❌ Спершу вкажіть API-ключ у «Налаштуваннях».','err');return}
 gen=true;render();job('⏳ Оновлення даних…');
 try{await refresh(); if(!snapshot)throw new Error('Немає даних таблиці.');
  const json=await ai.generateReportJson({snapshot,year:S.year,apiKey:S.key,provider:S.prov,model:S.model,maxTokens:32000,onProgress:n=>job('⏳ ШІ пише звіт… ('+Math.round(n/1000)+' тис. символів). Це може зайняти кілька хвилин.')});
  job('⏳ Складання Word-документа…');const warns=[];
  const blob=await docx.buildDocx(json,{year:S.year,periodText:S.period,onWarn:w=>warns.push(w)});
  const d=new Date(),p=n=>String(n).padStart(2,'0'),name='Zvit_'+S.year+'_'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+'.docx';
  const url=URL.createObjectURL(blob);const all=[...(json.warnings||[]),...warns].map(String);
  job('✅ Звіт готовий: <a class="dl" id="dl" href="'+url+'" download="'+name+'">Завантажити .docx</a>'+(all.length?'<div class="box warn"><b>Перевірте перед використанням:</b><ul>'+all.map(w=>'<li>'+esc2(w)+'</li>').join('')+'</ul></div>':'')+'<p class="meta">У Word погодьтеся оновити поля — так проставляться номери сторінок у змісті. Цифри звіртайте з таблицею.</p>');
  $('dl').click();
 }catch(e){job('❌ '+esc2(e.message),'err')}finally{gen=false;render()}};
loadForm();render();refresh();setInterval(refresh,60000);
